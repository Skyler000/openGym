name: winterarc

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
        if [ -z "$$(ls -A /out/img/fdb 2>/dev/null)" ]; then
          echo "↓ Downloading free-exercise-db images (public domain, ~49 MB, one time)…"
          git clone --depth 1 https://github.com/yuhonas/free-exercise-db /tmp/fdb
          mkdir -p /out/img/fdb
          cd /tmp/fdb/exercises
          for d in */; do if [ -f "$${d}0.jpg" ]; then mkdir -p "/out/img/fdb/$${d}"; cp "$${d}0.jpg" "/out/img/fdb/$${d}0.jpg"; fi; done
          echo "✓ free-exercise-db images ready ($$(find /out/img/fdb -name 0.jpg | wc -l))."
        else
          echo "✓ free-exercise-db images already present — skipping."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # Built from source in this repo. The upstream prebuilt images
  # (ghcr.io/duartesantos8/opengym-api:latest) were removed deliberately: pulling a
  # mutable `:latest` tag from a third party's registry runs binaries nobody here has
  # audited, and the tag can change contents under you between pulls. If you do want
  # them back, pin by immutable digest (image: ghcr.io/...@sha256:<digest>), never `:latest`.
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    build:
      context: .
      # The Dockerfile lives at the repo root (it was moved out of web/ in commit 3c09425,
      # but this reference was never updated — `docker compose up --build` failed until now).
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      # WEB_BIND=127.0.0.1 keeps the port reachable only from this machine — for a server where a
      # reverse proxy in front provides HTTPS. Docker publishes ports past host firewalls like ufw.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
